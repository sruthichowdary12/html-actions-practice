
name: HTML Project Validation

on:
  push:
  pull_request:

jobs:
  validate-html:
    name: Validate HTML File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML file exists
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html does not exist"
            exit 1
          fi
          echo "SUCCESS: index.html exists"

      - name: Check HTML file is not empty
        run: |
          if [ ! -s index.html ]; then
            echo "ERROR: index.html is empty"
            exit 1
          fi
          echo "SUCCESS: index.html is not empty"

      - name: Display validation result
        run: echo "HTML project validation passed!"
